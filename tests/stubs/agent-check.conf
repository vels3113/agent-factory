# Stub check profile for tests/task-workflow.sh: two presets, a ctest-like and
# a pytest-like suite. Output and exit codes come from files in $STUB_DIR;
# STUB_* variables set time limits, slots, sleeps and failures.
CHECK_PRESETS=(dev rel)
CHECK_DEFAULT_PRESET=dev
CHECK_DEFAULT_SUITE=unit
declare -A CHECK_PARSER=([unit]=ctest [py]=pytest)
CHECK_BUILD_PATHS=('*.c')
CHECK_TIMEOUT_MIN=${STUB_TIMEOUT_MIN:-1}
CHECK_WAIT_MIN=${STUB_WAIT_MIN:-1}
CHECK_SLOTS=${STUB_SLOTS:-5}
check_build() {
    echo "preset=$PRESET" >> "$STUB_DIR/builds"
    [[ -z "${STUB_SLEEP:-}" ]] || sleep "$STUB_SLEEP"
    [[ -z "${STUB_TOUCH:-}" ]] || echo "// touched" >> "$STUB_TOUCH"
    cat "$STUB_DIR/build.out" 2>/dev/null
    [[ "$PRESET" == "${STUB_FAIL_PRESET:-}" ]] && return 2
    return "$(cat "$STUB_DIR/build.rc" 2>/dev/null || echo 0)"
}
test_unit() { echo "unit:$*" >> "$STUB_DIR/tests"; cat "$STUB_DIR/test.out" 2>/dev/null; return "$(cat "$STUB_DIR/test.rc")"; }
test_py() { cat "$STUB_DIR/py.out" 2>/dev/null; return "$(cat "$STUB_DIR/py.rc")"; }
list_unit() { printf 'parse_ok\nparse_bad\n'; }
