name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      model:
        description: "Also run tests/agent-model.sh (real model calls)"
        type: boolean
        default: false

env:
  OPENCODE_VERSION: "2.1.3"
  AGENT_TEST_CACHE: ${{ github.workspace }}/.cache/agent-factory-tests

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: for f in bootstrap/*.sh scripts/*.sh tests/*.sh; do bash -n "$f"; done

      - name: Cache OpenCode
        uses: actions/cache@v4
        with:
          path: ${{ env.AGENT_TEST_CACHE }}
          key: opencode-${{ env.OPENCODE_VERSION }}-${{ runner.os }}

      - name: Tests
        run: tests/run.sh ${{ inputs.model && '--model' || '' }}
